{{- if eq .Values.database.mode "embedded" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tickerlake.fullname" . }}-postgres-primary
  labels:
    {{- include "tickerlake.embeddedPostgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "tickerlake.embeddedPostgres.selectorLabels" . | nindent 4 }}
{{- end }}
