{{- if and (eq .Values.database.mode "embedded") (ne .Values.database.embedded.postgresUser "postgres") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tickerlake.fullname" . }}-postgres-initdb
  labels:
    {{- include "tickerlake.embeddedPostgres.labels" . | nindent 4 }}
data:
  01-init.sql: |
    -- Ensure the application database exists. The superuser role is created
    -- by POSTGRES_USER during first initialization.
    SELECT format('CREATE DATABASE %I OWNER %I', '{{ .Values.database.embedded.postgresDb }}', '{{ .Values.database.embedded.postgresUser }}')
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ .Values.database.embedded.postgresDb }}')\gexec
{{- end }}
