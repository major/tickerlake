{{- if eq .Values.database.mode "embedded" }}
{{- $fullname := include "tickerlake.fullname" . }}
{{- $secretName := printf "%s-postgres" $fullname }}
{{- $key := .Values.database.embedded.secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := .Values.database.embedded.postgresPassword }}
{{- if not $password }}
{{- if and $existing (hasKey ($existing.data | default dict) $key) }}
{{- $password = index $existing.data $key | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "tickerlake.embeddedPostgres.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
data:
  username: {{ .Values.database.embedded.postgresUser | b64enc | quote }}
  {{ $key }}: {{ $password | b64enc | quote }}
  uri: {{ printf "postgresql://%s:%s@%s-postgres-primary:5432/%s" .Values.database.embedded.postgresUser $password $fullname .Values.database.embedded.postgresDb | b64enc | quote }}
{{- end }}
