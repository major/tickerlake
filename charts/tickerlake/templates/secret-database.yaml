{{- if and (eq .Values.database.mode "external") (not .Values.database.existingSecret.name) .Values.database.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-database" (include "tickerlake.fullname" .) }}
  labels:
    {{- include "tickerlake.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.database.existingSecret.key | default "DATABASE_URL" }}: {{ .Values.database.url | b64enc | quote }}
{{- end }}
