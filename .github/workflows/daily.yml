name: Daily Update

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: tickerlake-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Download existing raw.duckdb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$LATEST_TAG" ]; then
            gh release download "$LATEST_TAG" --pattern "raw.duckdb" || true
          fi

      - name: Run update
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: uv run tickerlake update

      - name: Create release with DuckDB files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y.%m.%d-%H%M)"
          gh release create "$TAG" \
            --title "Update $TAG" \
            --notes "Daily update at $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            raw.duckdb tickerlake.duckdb

      - name: Notify downstream repository
        if: ${{ secrets.DOWNSTREAM_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_PAT }}
          DOWNSTREAM_REPO: ${{ vars.DOWNSTREAM_REPO }}
        run: |
          if [ -n "$DOWNSTREAM_REPO" ]; then
            gh api repos/$DOWNSTREAM_REPO/dispatches \
              --method POST \
              --field event_type=tickerlake-updated
          fi
