name: Daily Update

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: tickerlake-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Download existing raw.duckdb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download latest --pattern "raw.duckdb" || true

      - name: Run update
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: uv run tickerlake update

      - name: Create release if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest 2>/dev/null || \
            gh release create latest --title "Latest Data" --notes "Auto-updated by tickerlake pipeline"

      - name: Upload DuckDB files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest raw.duckdb tickerlake.duckdb --clobber

      - name: Notify downstream repository
        if: ${{ secrets.DOWNSTREAM_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_PAT }}
          DOWNSTREAM_REPO: ${{ vars.DOWNSTREAM_REPO }}
        run: |
          if [ -n "$DOWNSTREAM_REPO" ]; then
            gh api repos/$DOWNSTREAM_REPO/dispatches \
              --method POST \
              --field event_type=tickerlake-updated
          fi
