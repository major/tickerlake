name: Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD). Defaults to 5 years ago."
        required: false
        default: ""

concurrency:
  group: tickerlake-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Run backfill
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          if [ -n "${{ inputs.start_date }}" ]; then
            uv run tickerlake backfill --start-date "${{ inputs.start_date }}"
          else
            uv run tickerlake backfill
          fi

      - name: Create release with DuckDB files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y.%m.%d-%H%M)"
          gh release create "$TAG" \
            --title "Backfill $TAG" \
            --notes "Backfill run at $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            raw.duckdb tickerlake.duckdb
