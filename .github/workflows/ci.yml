name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type check
        run: make typecheck

      - name: Complexity
        run: make complexity

      - name: Test with coverage
        run: make test-cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          use_oidc: true

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # zizmor: ignore[unpinned-uses]
      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: '18'

      - name: Test PostgreSQL integration
        run: make test-postgres

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Render Helm templates (defaults)
        run: |
          helm template test charts/tickerlake \
            --set image.repository=ghcr.io/example/tickerlake \
            --set image.tag=test \
            --set massive.existingSecret=tickerlake-massive \
            --set database.clusterName=tickerlake-db > /tmp/render.yaml
          test -s /tmp/render.yaml
          grep -q '^kind: CronJob' /tmp/render.yaml
          grep -q '^kind: ServiceAccount' /tmp/render.yaml
          # CronJob args must be just [update] (post-cutover CLI has no --output-dir)
          awk '/^  jobTemplate:/,/^---/' /tmp/render.yaml | grep -q '"update"'

      - name: Lint Helm chart
        run: helm lint charts/tickerlake --strict

      - name: Verify schema rejects removed subcommands
        run: |
          if helm template test charts/tickerlake \
               --set image.repository=ghcr.io/example/tickerlake \
               --set image.tag=test \
               --set massive.existingSecret=tickerlake-massive \
               --set database.clusterName=tickerlake-db \
               --set cronjob.command=info > /dev/null 2>&1; then
            echo "ERROR: schema accepted removed subcommand 'info'" >&2
            exit 1
          fi

  build:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: [check, helm]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          file: Containerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container image
        run: |
          docker run --rm "${{ steps.meta.outputs.image }}:latest" --help
          docker run --rm --entrypoint id "${{ steps.meta.outputs.image }}:latest"
