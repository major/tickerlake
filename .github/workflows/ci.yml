name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type check
        run: make typecheck

      - name: Complexity
        run: make complexity

      - name: Test with coverage
        run: make test-cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          use_oidc: true

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # zizmor: ignore[unpinned-uses]
      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: '18'

      - name: Test PostgreSQL integration
        run: make test-postgres

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@916d0e51931c3e90ee43075f5c193e2e49e4b976 # v4.3.1
        with:
          version: v3.17.0

      - name: Render Helm templates (defaults)
        run: |
          helm template test charts/tickerlake \
            --set image.repository=ghcr.io/example/tickerlake \
            --set image.tag=test \
            --set massive.existingSecret=tickerlake-massive \
            --set database.clusterName=tickerlake-db > /tmp/render.yaml
          test -s /tmp/render.yaml
          grep -q '^kind: CronJob' /tmp/render.yaml
          grep -q '^kind: ServiceAccount' /tmp/render.yaml
          # CronJob args must be just [update] (post-cutover CLI has no --output-dir)
          awk '/^  jobTemplate:/,/^---/' /tmp/render.yaml | grep -q '"update"'

      - name: Lint Helm chart
        run: helm lint charts/tickerlake --strict

      - name: Verify schema rejects removed subcommands
        run: |
          if helm template test charts/tickerlake \
               --set image.repository=ghcr.io/example/tickerlake \
               --set image.tag=test \
               --set massive.existingSecret=tickerlake-massive \
               --set database.clusterName=tickerlake-db \
               --set cronjob.command=info > /dev/null 2>&1; then
            echo "ERROR: schema accepted removed subcommand 'info'" >&2
            exit 1
          fi
