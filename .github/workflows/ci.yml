name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type check
        run: make typecheck

      - name: Complexity
        run: make complexity

      - name: Test with coverage
        run: make test-cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          use_oidc: true

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Install PostgreSQL server for pytest-postgresql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql postgresql-contrib
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
          echo "PG_BIN=${PG_BIN}" >> "$GITHUB_ENV"
          echo "${PG_BIN}" >> "$GITHUB_PATH"
          echo "PYTEST_POSTGRESQL_EXECUTABLE=${PG_BIN}/postgres" >> "$GITHUB_ENV"

      - name: Test PostgreSQL integration
        run: make test-postgres
