[project]
name = "tickerlake"
version = "0.1.0"
description = "Stock Market ETL pipeline"
readme = "README.md"
authors = [
    { name = "Major Hayden", email = "major@mhtx.net" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "exchange-calendars>=4.13.2",
    "massive>=2.4.0",
    "polars>=1.39.0",
    "psycopg[binary]>=3.3",
    "rich>=14.0.0",
]

[project.scripts]
tickerlake = "tickerlake:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mutmut>=3.8.0",
    "pytest-cov>=7.0.0",
    "pytest-randomly>=4.0.1",
    "pytest-socket>=0.8.1",
    "pytest-xdist>=3.8.0",
    "pytest-postgresql>=6.0.0",
    "radon>=6.0.1",
    "ruff>=0.15.6",
    "ty>=0.0.23",
    "vulture>=2.15",
]

[tool.mutmut]
source_paths = ["src/tickerlake"]
pytest_add_cli_args = ["-o", "addopts="]
pytest_add_cli_args_test_selection = ["tests/"]
# Bound runaway mutants. Timeout = (full_suite_seconds + constant) * multiplier.
timeout_constant = 1.0
timeout_multiplier = 15.0
# Avoid forking mutant workers directly from the threaded test parent.
process_isolation = "forkserver"

[tool.ruff]
line-length = 120
src = [
    "src",
    "tests",
]
target-version = "py314"

[tool.ruff.lint]
preview = false
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "D",
    "DTZ",
    "E",
    "F",
    "FA",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "W191",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
]

[tool.ruff.format]
quote-style = "double"
