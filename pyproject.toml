[project]
name = "tickerlake"
version = "0.1.0"
description = "Stock Market ETL pipeline"
readme = "README.md"
authors = [
    { name = "Major Hayden", email = "major@mhtx.net" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb>=1.5.0",
    "exchange-calendars>=4.13.2",
    "massive>=2.4.0",
    "polars>=1.39.0",
    "rich>=14.0.0",
]

[project.scripts]
tickerlake = "tickerlake:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mutmut>=3.8.0",
    "pytest-cov>=7.0.0",
    "pytest-randomly>=4.0.1",
    "pytest-socket>=0.8.1",
    "radon>=6.0.1",
    "ruff>=0.15.6",
    "ty>=0.0.23",
    "vulture>=2.15",
    "xenon>=0.9.0",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
